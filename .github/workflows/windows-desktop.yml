# Build app desktop Windows (Tauri) — chạy trên runner windows-latest vì Tauri
# KHÔNG cross-compile từ macOS/Linux sang Windows được (cần MSVC + WebView2 SDK).
# Kết quả: Tre SSH.exe (chạy trực tiếp) + bộ cài .msi và NSIS -setup.exe.
name: Windows desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # bấm tay trong tab Actions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Icon .ico/.png trong repo sinh sẵn từ macOS; sinh lại bằng tauri icon cho chắc.
      - name: Sinh icon
        run: npx --yes @tauri-apps/cli@^2 icon app/Assets.xcassets/AppIcon.appiconset/mac-1024.png --output desktop/src-tauri/icons

      - name: Cài Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Tự gọi cargo (RUSTFLAGS chắc chắn ăn) thay vì để tauri CLI gọi hộ — đã kiểm chứng
      # bằng dumpbin: qua `cargo tauri build`, cờ crt-static bị bỏ, binary vẫn đòi
      # api-ms-win-crt-*.dll (Windows 8 / Server 2012 chưa cài UCRT là không mở được).
      # RUSTFLAGS chỉ đặt ở step này, không đặt cấp job: `cargo install tauri-cli` build cho
      # HOST, dính crt-static là hỏng proc-macro. Có --target nên build script vẫn chạy host bình thường.
      - name: Build binary
        working-directory: desktop/src-tauri
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Đóng gói MSI + NSIS
        working-directory: desktop/src-tauri
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo tauri bundle --target x86_64-pc-windows-msvc

      # CỔNG CHẶN: còn phụ thuộc CRT động thì fail luôn, không đẩy file lỗi cho người dùng tải.
      - name: Kiểm tra phụ thuộc CRT
        shell: pwsh
        run: |
          $exe = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/tre-ssh-desktop.exe"
          $dumpbin = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { Write-Error "không tìm thấy dumpbin"; exit 1 }
          $deps = & $dumpbin.FullName /dependents $exe
          $deps
          if ($deps -match "api-ms-win-crt|ucrtbase\.dll|vcruntime") {
            Write-Error "Binary vẫn link CRT động -> máy chưa cài UCRT sẽ báo thiếu api-ms-win-crt-*.dll"
            exit 1
          }
          Write-Host "OK: CRT đã link tĩnh."

      - uses: actions/upload-artifact@v4
        with:
          name: tre-ssh-windows
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/tre-ssh-desktop.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # Đẩy lên Releases khi push tag v*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
