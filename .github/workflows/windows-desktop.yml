# Build app desktop Windows (Tauri) — chạy trên runner windows-latest vì Tauri
# KHÔNG cross-compile từ macOS/Linux sang Windows được (cần MSVC + WebView2 SDK).
# Kết quả: Tre SSH.exe (chạy trực tiếp) + bộ cài .msi và NSIS -setup.exe.
name: Windows desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # bấm tay trong tab Actions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Icon .ico/.png trong repo sinh sẵn từ macOS; sinh lại bằng tauri icon cho chắc.
      - name: Sinh icon
        run: npx --yes @tauri-apps/cli@^2 icon app/Assets.xcassets/AppIcon.appiconset/mac-1024.png --output desktop/src-tauri/icons

      - name: Cài Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # RUSTFLAGS đặt ngay tại step này (không đặt cấp job) vì bước `cargo install tauri-cli`
      # ở trên build cho HOST — dính crt-static là hỏng proc-macro.
      # Kèm --target tường minh thì RUSTFLAGS chỉ áp cho artifact đích, build script chạy host bình thường.
      - name: Build
        working-directory: desktop/src-tauri
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo tauri build --target x86_64-pc-windows-msvc

      # In danh sách DLL mà .exe phụ thuộc. Nếu crt-static có tác dụng thì KHÔNG được
      # thấy api-ms-win-crt-*.dll / ucrtbase.dll / vcruntime140.dll trong danh sách này.
      - name: Kiểm tra phụ thuộc CRT
        shell: pwsh
        run: |
          $exe = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/tre-ssh-desktop.exe"
          $dumpbin = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) {
            & $dumpbin.FullName /dependents $exe
          } else {
            Write-Host "không tìm thấy dumpbin — soi chuỗi trong binary:"
            Select-String -Path $exe -Pattern "api-ms-win-crt" -AllMatches -Encoding Byte | Select-Object -First 5
          }

      - uses: actions/upload-artifact@v4
        with:
          name: tre-ssh-windows
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/tre-ssh-desktop.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # Đẩy lên Releases khi push tag v*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
