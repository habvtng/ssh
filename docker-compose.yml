services:
  ssh-web:
    build: .
    container_name: ssh-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Sinh 1 lần: openssl rand -base64 32  -> giữ cố định để giải mã dữ liệu cũ
      - MASTER_KEY=${MASTER_KEY:?set MASTER_KEY trong .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET trong .env}
      - BIND=0.0.0.0:8080
    volumes:
      - ./data:/app/data
    working_dir: /app
    # data.sqlite được tạo trong /app; map ra ./data nếu muốn persist tách biệt
