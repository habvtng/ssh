<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tre360 · SSH</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root{
    --bg:#0d1117; --panel:#11161d; --panel-2:#0a0e13; --line:#1f2630;
    --ink:#e6edf3; --muted:#7d8590; --accent:#3fb950; --accent-dim:#238636;
    --warn:#d29922; --danger:#f85149; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}

  /* Sidebar */
  .side{width:300px;min-width:300px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;height:100%}
  .brand{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .brand b{font-weight:600;letter-spacing:.3px}
  .brand span{color:var(--muted);font-size:12px;font-family:var(--mono)}

  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);padding:10px 6px;font-size:12px;
    border-bottom:2px solid transparent}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

  .list{flex:1;overflow:auto;padding:8px}
  .item{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;
    background:var(--panel-2);transition:border-color .15s}
  .item:hover{border-color:var(--accent-dim)}
  .item .h{display:flex;justify-content:space-between;align-items:center}
  .item .label{font-weight:600}
  .item .meta{color:var(--muted);font-size:12px;font-family:var(--mono);margin-top:3px}
  .item .act{display:flex;gap:6px}
  .ic{background:none;border:none;color:var(--muted);padding:2px 5px;border-radius:4px;font-size:13px}
  .ic:hover{color:var(--ink);background:#ffffff10}
  .ic.del:hover{color:var(--danger)}

  .add{margin:8px;padding:10px;border:1px dashed var(--line);border-radius:8px;background:none;
    color:var(--muted);width:calc(100% - 16px)}
  .add:hover{border-color:var(--accent);color:var(--accent)}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
  .termbar{height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .session-tabs{display:flex;gap:4px;flex:1;overflow:auto}
  .stab{padding:5px 12px;border-radius:6px 6px 0 0;background:var(--panel-2);border:1px solid var(--line);
    border-bottom:none;color:var(--muted);font-size:12px;font-family:var(--mono);white-space:nowrap;
    display:flex;align-items:center;gap:8px}
  .stab.on{background:var(--bg);color:var(--ink)}
  .stab .x{opacity:.6}
  .stab .x:hover{opacity:1;color:var(--danger)}
  #terms{flex:1;position:relative;background:var(--bg)}
  .term{position:absolute;inset:0;padding:6px 4px 4px 8px;display:none}
  .term.on{display:block}
  /* SFTP browser */
  .term.sftp{padding:0;display:none;flex-direction:column}
  .term.sftp.on{display:flex}
  .sftp-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);
    background:var(--panel);font-family:var(--mono);font-size:12px}
  .sftp-bar button{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:4px 9px;border-radius:6px;cursor:pointer}
  .sftp-bar button:hover{border-color:var(--accent);color:var(--accent)}
  .sftp-path{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sftp-list{flex:1;overflow:auto}
  .sftp-row{display:flex;justify-content:space-between;gap:12px;padding:7px 14px;cursor:pointer;
    border-bottom:1px solid #ffffff08;font-size:13px}
  .sftp-row:hover{background:#ffffff0d}
  .sftp-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sftp-row .s{color:var(--muted);font-family:var(--mono);font-size:11px;flex-shrink:0}
  .sftp-msg{padding:14px;color:var(--muted);font-size:13px}
  .filebody{max-height:60vh;overflow:auto;background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:12px;font-family:var(--mono);font-size:12px;white-space:pre;line-height:1.45}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:8px;color:var(--muted)}
  .empty code{font-family:var(--mono);color:var(--accent)}

  /* Dual pane (2 server, kéo thả) */
  .term.dual{padding:0;display:none;flex-direction:column}
  .term.dual.on{display:flex}
  .dual-wrap{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
  .pane:last-child{border-right:none}
  .pane-bar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);
    background:var(--panel)}
  .pane-bar select.pane-host{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink);border-radius:6px;padding:5px 8px;font-size:12px}
  .pane-bar button{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:4px 9px;border-radius:6px}
  .pane-bar button:hover{border-color:var(--accent);color:var(--accent)}
  .pane-path{padding:5px 12px;border-bottom:1px solid var(--line);color:var(--muted);
    font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pane-list{flex:1;overflow:auto;transition:background .1s}
  .pane-list.drop{background:#3fb9501a;outline:2px dashed var(--accent);outline-offset:-3px}
  .drow{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;cursor:grab;
    border-bottom:1px solid #ffffff08;font-size:13px}
  .drow:hover{background:#ffffff0d}
  .drow.dir-drop{background:#3fb95026;outline:1px dashed var(--accent);outline-offset:-2px}
  .drow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
  .drow .s{color:var(--muted);font-family:var(--mono);font-size:11px;flex-shrink:0;pointer-events:none}
  .dual-status{height:32px;display:flex;align-items:center;padding:0 14px;font-size:12px;
    font-family:var(--mono);color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
  .dual-status.err{color:var(--danger)}
  .dual-status.ok{color:var(--accent)}

  /* Snippet bar */
  .snipbar{height:38px;display:flex;align-items:center;gap:6px;padding:0 10px;overflow:auto;
    background:var(--panel);border-top:1px solid var(--line)}
  .snip{padding:4px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);
    color:var(--muted);font-size:12px;font-family:var(--mono);white-space:nowrap}
  .snip:hover{border-color:var(--accent);color:var(--accent)}

  /* Modal */
  .modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
  .modal.on{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:440px;max-width:92vw;
    padding:20px;max-height:88vh;overflow:auto}
  .card h3{margin:0 0 14px;font-weight:600}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink);border-radius:7px;padding:9px 11px;font-size:13px}
  .field textarea{font-family:var(--mono);min-height:90px;resize:vertical}
  .row{display:flex;gap:10px}
  .row .field{flex:1}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .btn{padding:9px 16px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
  .btn.primary{background:var(--accent-dim);border-color:var(--accent-dim);color:#fff}
  .btn.primary:hover{background:var(--accent)}

  /* Login */
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
  #login .card{width:360px}
  #login .brand{border:none;justify-content:center;padding:0 0 18px}
  .err{color:var(--danger);font-size:12px;min-height:16px;margin-top:4px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <div class="brand"><span class="dot"></span><b>tre360</b><span>· ssh</span></div>
    <div class="field"><label>Tài khoản</label><input id="lg-user" autocomplete="username"></div>
    <div class="field"><label>Mật khẩu</label><input id="lg-pass" type="password" autocomplete="current-password"></div>
    <div class="err" id="lg-err"></div>
    <div class="actions">
      <button class="btn" onclick="doAuth('register')">Đăng ký</button>
      <button class="btn primary" onclick="doAuth('login')">Đăng nhập</button>
    </div>
  </div>
</div>

<!-- SIDEBAR -->
<aside class="side">
  <div class="brand"><span class="dot"></span><b>tre360</b><span>· ssh</span></div>
  <div class="tabs">
    <button class="on" data-tab="hosts" onclick="switchTab('hosts')">Hosts</button>
    <button data-tab="keys" onclick="switchTab('keys')">Keys</button>
    <button data-tab="snippets" onclick="switchTab('snippets')">Snippets</button>
    <button data-tab="tunnels" onclick="switchTab('tunnels')">Tunnels</button>
    <button data-tab="sftp" onclick="switchTab('sftp')">SFTP</button>
    <button data-tab="dual" onclick="openDual()">2 Server</button>
  </div>
  <div class="list" id="list"></div>
  <button class="add" id="addBtn" onclick="openAdd()">+ Thêm</button>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="termbar"><div class="session-tabs" id="sessTabs"></div></div>
  <div id="terms">
    <div class="empty" id="emptyState">
      <div>Chọn một host để mở phiên SSH</div>
      <div><code>tre360.vn</code> · web terminal</div>
    </div>
  </div>
  <div class="snipbar" id="snipbar"></div>
</main>

<!-- MODAL -->
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script>
const API = '/api';
let token = localStorage.getItem('token') || '';
let tab = 'hosts';
let cache = { hosts:[], keys:[], snippets:[], tunnels:[] };
let sessions = {};        // id -> {term, fit, ws, el}
let active = null;

// ---- HTTP helper ----
async function http(method, path, body){
  const r = await fetch(API+path, {
    method,
    headers:{ 'Content-Type':'application/json', ...(token?{Authorization:'Bearer '+token}:{}) },
    body: body?JSON.stringify(body):undefined
  });
  if(r.status===401){ logout(); throw new Error('unauthorized'); }
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.statusText);
  return r.json().catch(()=>({}));
}

// ---- Auth ----
async function doAuth(kind){
  const u=document.getElementById('lg-user').value.trim();
  const p=document.getElementById('lg-pass').value;
  const err=document.getElementById('lg-err'); err.textContent='';
  if(!u||!p){ err.textContent='Nhập đủ tài khoản và mật khẩu'; return; }
  try{
    const r = await fetch(API+'/auth/'+kind, {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u,password:p})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||'lỗi');
    token=d.token; localStorage.setItem('token',token);
    document.getElementById('login').classList.remove('on');
    document.getElementById('login').style.display='none';
    loadAll();
  }catch(e){ err.textContent = e.message; }
}
function logout(){ token=''; localStorage.removeItem('token'); location.reload(); }

// ---- Data ----
async function loadAll(){
  await Promise.all([
    http('GET','/hosts').then(d=>cache.hosts=d).catch(()=>{}),
    http('GET','/keys').then(d=>cache.keys=d).catch(()=>{}),
    http('GET','/snippets').then(d=>cache.snippets=d).catch(()=>{}),
    http('GET','/tunnels').then(d=>cache.tunnels=d).catch(()=>{}),
  ]);
  render(); renderSnips();
}

function switchTab(t){
  tab=t;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  render();
}

function render(){
  const el=document.getElementById('list'); el.innerHTML='';
  // tab SFTP tái dùng danh sách hosts.
  const data=(tab==='sftp'?cache.hosts:cache[tab])||[];
  document.getElementById('addBtn').style.display = tab==='sftp'?'none':'block';
  data.forEach(x=>{
    const d=document.createElement('div'); d.className='item';
    let label, meta, actions='';
    if(tab==='hosts'){ label=x.label; meta=`${x.username}@${x.host}:${x.port} · ${x.auth_type}`;
      actions=`<button class="ic" title="Kết nối" onclick="openSession('${x.id}','${escapeAttr(x.label)}')">▷</button>`; }
    else if(tab==='sftp'){ label=x.label; meta=`${x.username}@${x.host}`;
      actions=`<button class="ic" title="Duyệt file" onclick="openSftp('${x.id}','${escapeAttr(x.label)}')">📁</button>`; }
    else if(tab==='keys'){ label=x.name; meta='private key'; }
    else if(tab==='snippets'){ label=x.name; meta=x.command; }
    else { label=x.kind+' '+x.listen_port; meta=`${x.listen_host}:${x.listen_port} → ${x.dest_host||''}:${x.dest_port||''}`; }
    d.innerHTML=`<div class="h"><span class="label">${esc(label)}</span>
      <span class="act">
        ${actions}
        ${tab==='sftp'?'':`<button class="ic del" title="Xóa" onclick="del('${tab}','${x.id}')">✕</button>`}
      </span></div>
      <div class="meta">${esc(meta)}</div>`;
    if(tab==='hosts') d.querySelector('.label').onclick=()=>openSession(x.id,x.label);
    if(tab==='sftp')  d.querySelector('.label').onclick=()=>openSftp(x.id,x.label);
    el.appendChild(d);
  });
  if(!data.length) el.innerHTML='<div style="color:var(--muted);padding:14px;text-align:center;font-size:13px">'+(tab==='sftp'?'Chưa có host':'Trống')+'</div>';
}

function renderSnips(){
  const bar=document.getElementById('snipbar'); bar.innerHTML='';
  cache.snippets.forEach(s=>{
    const b=document.createElement('button'); b.className='snip'; b.textContent=s.name;
    b.title=s.command; b.onclick=()=>sendToActive(s.command+'\n');
    bar.appendChild(b);
  });
}

async function del(kind,id){
  if(!confirm('Xóa mục này?')) return;
  await http('DELETE','/'+kind+'/'+id);
  loadAll();
}

// ---- Sessions / terminal ----
function openSession(hostId, label){
  document.getElementById('emptyState').style.display='none';
  const id = hostId+'-'+Date.now();
  const el = document.createElement('div'); el.className='term'; el.id='t-'+id;
  document.getElementById('terms').appendChild(el);

  const term = new Terminal({ fontFamily:"'JetBrains Mono',monospace", fontSize:13,
    theme:{ background:'#0d1117', foreground:'#e6edf3', cursor:'#3fb950' }, cursorBlink:true });
  const fit = new FitAddon.FitAddon(); term.loadAddon(fit);
  term.open(el);

  const proto = location.protocol==='https:'?'wss':'ws';
  // gửi token qua subprotocol (server đọc Sec-WebSocket-Protocol)
  const ws = new WebSocket(`${proto}://${location.host}/ws/ssh/${hostId}`, token);
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{ fit.fit(); sendResize(ws,term); term.focus(); };
  ws.onmessage=(e)=>{
    if(typeof e.data==='string'){ term.write('\r\n['+e.data+']\r\n'); }
    else term.write(new Uint8Array(e.data));
  };
  ws.onclose=()=>term.write('\r\n\x1b[33m[disconnected]\x1b[0m\r\n');
  term.onData(d=>ws.readyState===1 && ws.send(JSON.stringify({t:'data',d})));

  sessions[id]={term,fit,ws,el,label};
  addSessTab(id,label);
  activate(id);
  new ResizeObserver(()=>{ if(active===id){ fit.fit(); sendResize(ws,term);} }).observe(el);
}

function sendResize(ws,term){ if(ws.readyState===1) ws.send(JSON.stringify({t:'resize',cols:term.cols,rows:term.rows})); }
function sendToActive(text){ const s=sessions[active]; if(s&&s.ws&&s.ws.readyState===1) s.ws.send(JSON.stringify({t:'data',d:text})); }

function addSessTab(id,label){
  const t=document.createElement('div'); t.className='stab'; t.id='st-'+id;
  t.innerHTML=`<span>${esc(label)}</span><span class="x" onclick="event.stopPropagation();closeSession('${id}')">✕</span>`;
  t.onclick=()=>activate(id);
  document.getElementById('sessTabs').appendChild(t);
}
function activate(id){
  active=id;
  Object.entries(sessions).forEach(([k,s])=>{
    s.el.classList.toggle('on',k===id);
    document.getElementById('st-'+k)?.classList.toggle('on',k===id);
  });
  const s=sessions[id]; if(s && s.term){ s.fit.fit(); sendResize(s.ws,s.term); s.term.focus(); }
}
function closeSession(id){
  const s=sessions[id]; if(!s) return;
  if(s.term){ s.ws.close(); s.term.dispose(); s.el.remove(); }
  else { s.el.remove(); }
  document.getElementById('st-'+id)?.remove();
  delete sessions[id];
  const rest=Object.keys(sessions);
  if(rest.length) activate(rest[rest.length-1]);
  else { active=null; document.getElementById('emptyState').style.display='flex'; }
}

// ---- SFTP browser ----
function openSftp(hostId, label){
  document.getElementById('emptyState').style.display='none';
  const id='sftp-'+hostId+'-'+Date.now();
  const el=document.createElement('div'); el.className='term sftp on'; el.id='t-'+id;
  el.innerHTML=`<div class="sftp-bar">
      <button title="Thư mục cha" data-up>⬆ ..</button>
      <button title="Tải lại" data-reload>⟳</button>
      <span class="sftp-path">/</span>
    </div><div class="sftp-list"><div class="sftp-msg">đang tải…</div></div>`;
  document.getElementById('terms').appendChild(el);
  const state={hostId,path:'.'};
  sessions[id]={el,label,sftp:true,state};
  addSessTab(id,'📁 '+label);
  activate(id);
  el.querySelector('[data-up]').onclick=()=>navSftp(id,joinPath(state.path,'..'));
  el.querySelector('[data-reload]').onclick=()=>navSftp(id,state.path);
  navSftp(id,'.');
}

async function navSftp(id, path){
  const s=sessions[id]; if(!s||!s.sftp) return;
  const list=s.el.querySelector('.sftp-list');
  list.innerHTML='<div class="sftp-msg">đang tải…</div>';
  try{
    const d=await http('POST','/sftp/list',{host_id:s.state.hostId, path});
    s.state.path=d.path;
    s.el.querySelector('.sftp-path').textContent=d.path;
    renderSftpList(id, d.entries);
  }catch(e){ list.innerHTML='<div class="sftp-msg">Lỗi: '+esc(e.message)+'</div>'; }
}

function renderSftpList(id, entries){
  const s=sessions[id]; const list=s.el.querySelector('.sftp-list'); list.innerHTML='';
  if(!entries.length){ list.innerHTML='<div class="sftp-msg">(thư mục trống)</div>'; return; }
  entries.forEach(en=>{
    const row=document.createElement('div'); row.className='sftp-row';
    const icon=en.type==='dir'?'📁':(en.type==='symlink'?'🔗':'📄');
    const size=en.type==='dir'?'':fmtSize(en.size);
    row.innerHTML=`<span class="n">${icon} ${esc(en.name)}</span><span class="s">${size}</span>`;
    row.onclick=()=>{
      const p=joinPath(s.state.path, en.name);
      if(en.type==='dir') navSftp(id,p);
      else viewFile(s.state.hostId, p, en.name);
    };
    list.appendChild(row);
  });
}

async function viewFile(hostId, path, name){
  try{
    const d=await http('POST','/sftp/read',{host_id:hostId, path});
    const body = d.kind==='text'
      ? `<pre class="filebody">${esc(d.content)}</pre>`
      : `<div class="sftp-msg">File nhị phân (${fmtSize(d.size)}) — không hiển thị trực tiếp.</div>`;
    const trunc = d.truncated ? `<div class="sftp-msg">⚠ Đã cắt còn 1 MB đầu (file ${fmtSize(d.size)}).</div>` : '';
    showModal(`<h3>${esc(name)}</h3>${trunc}${body}
      <div class="actions"><button class="btn" onclick="closeModal()">Đóng</button></div>`);
  }catch(e){
    showModal(`<h3>Lỗi đọc file</h3><div class="sftp-msg">${esc(e.message)}</div>
      <div class="actions"><button class="btn" onclick="closeModal()">Đóng</button></div>`);
  }
}

// ---- Dual pane: 2 server cạnh nhau, kéo thả copy ----
function openDual(){
  if(!cache.hosts.length){ alert('Chưa có host nào. Thêm host ở tab Hosts trước.'); return; }
  document.getElementById('emptyState').style.display='none';
  const id='dual-'+Date.now();
  const el=document.createElement('div'); el.className='term dual on'; el.id='t-'+id;
  el.innerHTML=`<div class="dual-wrap">
      ${dualPaneHTML('A')}${dualPaneHTML('B')}
    </div>
    <div class="dual-status">Chọn server cho mỗi khung rồi kéo file/thư mục từ khung này sang khung kia để copy.</div>`;
  document.getElementById('terms').appendChild(el);
  sessions[id]={el,label:'2 Server',dual:true,state:{A:{hostId:null,path:'.'},B:{hostId:null,path:'.'}}};
  addSessTab(id,'⇄ 2 Server');
  activate(id);
  initDual(id);
}

function dualPaneHTML(side){
  return `<div class="pane" data-side="${side}">
    <div class="pane-bar">
      <select class="pane-host"></select>
      <button data-up title="Thư mục cha">⬆</button>
      <button data-reload title="Tải lại">⟳</button>
    </div>
    <div class="pane-path">—</div>
    <div class="pane-list"><div class="sftp-msg">Chọn server…</div></div>
  </div>`;
}

function initDual(id){
  const s=sessions[id], el=s.el;
  const opts='<option value="">— chọn server —</option>'+
    cache.hosts.map(h=>`<option value="${h.id}">${esc(h.label)}</option>`).join('');
  ['A','B'].forEach(side=>{
    const pane=el.querySelector('.pane[data-side="'+side+'"]');
    const sel=pane.querySelector('.pane-host'); sel.innerHTML=opts;
    sel.onchange=()=>{
      s.state[side].hostId=sel.value||null; s.state[side].path='.';
      if(sel.value) loadPane(id,side,'.');
      else { pane.querySelector('.pane-list').innerHTML='<div class="sftp-msg">Chọn server…</div>';
             pane.querySelector('.pane-path').textContent='—'; }
    };
    pane.querySelector('[data-up]').onclick=()=>{ if(s.state[side].hostId) loadPane(id,side,joinPath(s.state[side].path,'..')); };
    pane.querySelector('[data-reload]').onclick=()=>{ if(s.state[side].hostId) loadPane(id,side,s.state[side].path); };
    // Khung là vùng thả: copy vào thư mục đang mở.
    const list=pane.querySelector('.pane-list');
    list.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy'; list.classList.add('drop'); });
    list.addEventListener('dragleave',e=>{ if(e.target===list) list.classList.remove('drop'); });
    list.addEventListener('drop',e=>{ e.preventDefault(); list.classList.remove('drop'); doTransfer(id,side,e,null); });
  });
}

async function loadPane(id, side, path){
  const s=sessions[id]; if(!s||!s.dual) return;
  const pane=s.el.querySelector('.pane[data-side="'+side+'"]');
  const list=pane.querySelector('.pane-list');
  list.innerHTML='<div class="sftp-msg">đang tải…</div>';
  try{
    const d=await http('POST','/sftp/list',{host_id:s.state[side].hostId, path});
    s.state[side].path=d.path;
    pane.querySelector('.pane-path').textContent=d.path;
    renderPane(id, side, d.entries);
  }catch(e){ list.innerHTML='<div class="sftp-msg">Lỗi: '+esc(e.message)+'</div>'; }
}

function renderPane(id, side, entries){
  const s=sessions[id];
  const pane=s.el.querySelector('.pane[data-side="'+side+'"]');
  const list=pane.querySelector('.pane-list'); list.innerHTML='';
  if(!entries.length){ list.innerHTML='<div class="sftp-msg">(thư mục trống)</div>'; return; }
  entries.forEach(en=>{
    const full=joinPath(s.state[side].path, en.name);
    const row=document.createElement('div'); row.className='drow'; row.draggable=true;
    const icon=en.type==='dir'?'📁':(en.type==='symlink'?'🔗':'📄');
    row.innerHTML=`<span class="n">${icon} ${esc(en.name)}</span><span class="s">${en.type==='dir'?'':fmtSize(en.size)}</span>`;
    row.addEventListener('dragstart',ev=>{
      ev.dataTransfer.effectAllowed='copy';
      ev.dataTransfer.setData('text/plain', JSON.stringify({hostId:s.state[side].hostId, path:full, name:en.name, type:en.type}));
    });
    if(en.type==='dir'){
      row.onclick=()=>loadPane(id,side,full);
      // Thả thẳng vào thư mục con này.
      row.addEventListener('dragover',ev=>{ ev.preventDefault(); ev.stopPropagation(); row.classList.add('dir-drop'); });
      row.addEventListener('dragleave',()=>row.classList.remove('dir-drop'));
      row.addEventListener('drop',ev=>{ ev.preventDefault(); ev.stopPropagation(); row.classList.remove('dir-drop'); doTransfer(id,side,ev,full); });
    }
    list.appendChild(row);
  });
}

async function doTransfer(id, side, e, destFolder){
  const s=sessions[id]; const dest=s.state[side];
  let p; try{ p=JSON.parse(e.dataTransfer.getData('text/plain')); }catch{ return; }
  if(!dest.hostId){ dualStatus(id,'Chọn server cho khung đích trước.','err'); return; }
  const dstDir=destFolder||dest.path;
  if(p.hostId===dest.hostId && p.path===joinPath(dstDir,p.name)){ dualStatus(id,'Nguồn và đích trùng nhau.','err'); return; }
  dualStatus(id,`⏳ Đang copy "${p.name}" → ${dstDir} …`);
  try{
    const r=await http('POST','/sftp/transfer',{src_host_id:p.hostId, src_path:p.path, dst_host_id:dest.hostId, dst_dir:dstDir, name:p.name});
    dualStatus(id,`✓ Đã copy "${p.name}" (${r.files} file, ${fmtSize(r.bytes)}) → ${r.dst}`,'ok');
    loadPane(id, side, dest.path);
  }catch(err){ dualStatus(id,'Lỗi copy: '+err.message,'err'); }
}

function dualStatus(id, msg, kind){
  const bar=sessions[id]?.el.querySelector('.dual-status'); if(!bar) return;
  bar.className='dual-status'+(kind?' '+kind:''); bar.textContent=msg;
}

// Ghép đường dẫn; giữ '..' để server canonicalize tự rút gọn.
function joinPath(base, name){
  if(name==='..') return (base==='/'||base==='.'?base:base.replace(/\/+$/,'')) + '/..';
  if(base==='/'||base==='') return '/'+name;
  return base.replace(/\/+$/,'') + '/' + name;
}
function fmtSize(n){
  if(n==null) return '';
  const u=['B','K','M','G','T']; let i=0, x=Number(n);
  while(x>=1024 && i<u.length-1){ x/=1024; i++; }
  return (i===0?x:x.toFixed(1))+u[i];
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s){ return String(s).replace(/'/g,"\\'"); }
