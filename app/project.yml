name: Tre360SSH
options:
  bundleIdPrefix: vn.tre360
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.12.1"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: "1.2.0"

targets:
  Tre360SSH:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: Citadel
      - package: SwiftTerm
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: "Tre SSH"
        LSApplicationCategoryType: "public.app-category.developer-tools"
        NSHumanReadableCopyright: "tre360.vn"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # iOS chặn kết nối tới IP mạng LAN nếu thiếu key này (Local Network Privacy).
        NSLocalNetworkUsageDescription: "Ứng dụng cần truy cập mạng nội bộ để kết nối SSH tới máy chủ trong cùng mạng LAN."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: vn.tre360.ssh.sftp-ref
            UTTypeDescription: SFTP file reference
            UTTypeConformsTo:
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.tre360.ssh
        PRODUCT_NAME: Tre SSH
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FPGAZ7K989
        # Entitlements sandbox chỉ áp cho macOS; iOS dùng mặc định để ký lên iPhone thật không lỗi.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Support/app.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
